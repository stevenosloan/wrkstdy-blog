name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2" # keep in step with GO_VERSION in netlify.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Encoded photos, so a run only encodes photos that are new or changed (the
      # tests build the real site). Saved under a new key when the photos or the
      # code that encodes them change; otherwise the nearest earlier cache is
      # restored. The build prunes entries it hasn't used in 30 days.
      - uses: actions/cache@v6
        with:
          path: .cache/images
          key: photos-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'internal/site/images.go', 'internal/site/color.go') }}
          restore-keys: photos-
      - run: go tool mage test
      - run: go tool mage build -drafts
