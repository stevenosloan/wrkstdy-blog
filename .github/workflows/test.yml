name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.7" # keep in step with GO_VERSION in netlify.toml
      - run: go tool mage test
      - run: go tool mage build -drafts
