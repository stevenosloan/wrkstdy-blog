[build]
  command = "go run ./cmd/wrkstdy build"
  publish = "public"

[build.environment]
  GO_VERSION = "1.24.7"

[context.deploy-preview]
  command = "go run ./cmd/wrkstdy build -baseurl $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "go run ./cmd/wrkstdy build -baseurl $DEPLOY_PRIME_URL"

# Fonts never change, and css/ and js/ files carry a content hash in their names.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
