[build]
  command = "go tool mage build -production"
  publish = "public"

[build.environment]
  GO_VERSION = "1.24.7"

# Pull request previews include drafts, so posts can be reviewed before they're published.
[context.deploy-preview]
  command = "go tool mage build -production -baseurl=$DEPLOY_PRIME_URL -drafts"

[context.branch-deploy]
  command = "go tool mage build -production -baseurl=$DEPLOY_PRIME_URL"

# Fonts never change, and css/ and js/ files carry a content hash in their names.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
