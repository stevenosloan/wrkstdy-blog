[build]
  command = "go tool mage build -production"
  publish = "public"

[build.environment]
  GO_VERSION = "1.24.7"

# Pull request previews include drafts, so posts can be reviewed before they're published.
[context.deploy-preview]
  command = "go tool mage build -production -baseurl=$DEPLOY_PRIME_URL -drafts"

[context.branch-deploy]
  command = "go tool mage build -production -baseurl=$DEPLOY_PRIME_URL"

# Everything under /assets/ carries a content hash in its name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
