[build]
  command = "go tool mage check"
  publish = "public"

[build.environment]
  GO_VERSION = "1.24.7"

[context.deploy-preview]
  command = "BASEURL=$DEPLOY_PRIME_URL go tool mage check"

[context.branch-deploy]
  command = "BASEURL=$DEPLOY_PRIME_URL go tool mage check"

# Fonts never change, and css/ and js/ files carry a content hash in their names.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
