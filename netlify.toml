[build]
  command = "npm ci && go tool mage build -production"
  publish = "public"

[build.environment]
  GO_VERSION = "1.27.2"

# Pull request previews include drafts, so posts can be reviewed before they're published.
[context.deploy-preview]
  command = "npm ci && go tool mage build -production -baseurl=$DEPLOY_PRIME_URL -drafts"

[context.branch-deploy]
  command = "npm ci && go tool mage build -production -baseurl=$DEPLOY_PRIME_URL"

# Purges Cloudflare's whole cache after each production deploy, so new pages don't wait out the edge TTL.
# Needs CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN set in Netlify. Production only: previews and branch
# deploys don't change what's at wrkstdy.com, so they shouldn't empty its cache.
[[context.production.plugins]]
  package = "netlify-purge-cloudflare-on-deploy"

# Everything under /assets/ carries a content hash in its name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Browsers can reuse a page for an hour; a deploy can take that long to reach someone who already has it.
# Add a rule here for any page that lands outside these paths.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
