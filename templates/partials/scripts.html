{{- /* MicroLighter only loads on pages that have highlighted code blocks. */ -}}
{{ if .Page.HasCode -}}
{{ $hl := .Site.Asset "js/microlighter.js" -}}
<script type="module" src="{{ $hl.URL }}" integrity="{{ $hl.Integrity }}"></script>
{{ end -}}
{{ if .Page.HasMermaid -}}
{{ $js := .Site.Asset "js/mermaid.js" -}}
<script type="module" src="{{ $js.URL }}" integrity="{{ $js.Integrity }}"></script>
{{ end -}}
