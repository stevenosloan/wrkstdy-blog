<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ if eq .Page.URL "/" }}{{ .Site.Title }}{{ else }}{{ .Page.Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ or .Page.Description .Site.Description }}">
{{ if eq .Page.URL "/404.html" -}}
<meta name="robots" content="noindex">
{{ else -}}
<link rel="canonical" href="{{ .Site.AbsURL .Page.URL }}">
{{ end -}}
{{ range .Site.Sections -}}
<link rel="alternate" type="application/rss+xml" title="{{ .FeedTitle $.Site }}" href="{{ $.Site.AbsURL .FeedURL }}">
{{ end -}}
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="{{ (.Site.Asset "icons/favicon.svg").URL }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ (.Site.Asset "icons/apple-touch-icon.png").URL }}">
<link rel="preload" href="{{ (.Site.Asset "fonts/firava-latin-wght-normal.woff2").URL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ (.Site.Asset "fonts/fira-code-latin-wght-normal.woff2").URL }}" as="font" type="font/woff2" crossorigin>
{{ $css := .Site.Asset "css/main.css" -}}
<link rel="stylesheet" href="{{ $css.URL }}" integrity="{{ $css.Integrity }}">
