<header class="site-header">
  <a class="wordmark" href="/">{{ .Site.Title }}</a>
  {{- with .Site.Menu }}
  <nav aria-label="Main">
    {{- range . }}
    <a href="{{ .URL }}"{{ if active $.Page.URL .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  {{- end }}
</header>
